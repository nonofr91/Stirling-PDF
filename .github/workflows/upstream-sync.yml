name: Upstream Sync

# Daily check for new commits on Stirling-Tools/Stirling-PDF main.
# Creates a sync branch off prepress and opens a PR when upstream moved.
# Clean merges come ready to merge; conflicted merges are committed as a
# draft PR so the conflict sites are visible in the diff and CI output.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/Stirling-Tools/Stirling-PDF.git
  TARGET_BRANCH: prepress
  SYNC_BRANCH: sync/upstream-main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT is preferred: PRs opened with GITHUB_TOKEN do not trigger pull_request workflows.
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream main --tags

      - name: Check if sync is needed
        id: check
        run: |
          git fetch origin "$TARGET_BRANCH"
          behind=$(git rev-list --count "origin/$TARGET_BRANCH..upstream/main")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Upstream is $behind commit(s) ahead of $TARGET_BRANCH"

      - name: Skip up-to-date
        if: steps.check.outputs.skip == 'true'
        run: echo "prepress already contains upstream/main — nothing to do."

      - name: Prepare sync branch
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BRANCH"

      - name: Merge upstream/main
        id: merge
        if: steps.check.outputs.skip != 'true'
        run: |
          if git merge upstream/main --no-edit; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            git ls-files -u | awk '{print $4}' | sort -u > /tmp/conflicts.txt
            # Commit the conflicted tree so the PR diff exposes every conflict site;
            # the branch exists only to be resolved, never to deploy.
            git add -A
            git commit --no-edit -m "WIP: upstream merge with conflicts (resolve before merging)"
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            cat /tmp/conflicts.txt
            cp /tmp/conflicts.txt "$GITHUB_WORKSPACE/conflicts.txt"
          fi

      - name: Push sync branch
        if: steps.check.outputs.skip != 'true'
        run: git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open or update PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          cd "$GITHUB_WORKSPACE"
          upstream_sha=$(git rev-parse --short upstream/main)
          title="sync: upstream/main ($upstream_sha) into $TARGET_BRANCH"
          existing=$(gh pr list --head "$SYNC_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number // empty' || true)

          body_file=$(mktemp)
          {
            echo "## Upstream sync"
            echo
            echo "Automated merge of \`upstream/main\` (\`$upstream_sha\`) into \`$TARGET_BRANCH\`."
            echo
            if [ "$CONFLICTS" = "true" ]; then
              echo "**Merge conflicts to resolve** — the conflicted tree is committed on this branch;"
              echo "check it out, resolve the markers, push, then undraft:"
              echo
              echo '```'
              cat conflicts.txt 2>/dev/null || git diff --name-only --diff-filter=U HEAD~1 2>/dev/null || true
              echo '```'
              echo
              echo "\`git fetch origin && git checkout $SYNC_BRANCH && git checkout -b resolve && git reset --soft HEAD~1\`"
              echo "then resolve, \`git commit\`, push to \`$SYNC_BRANCH\`."
            else
              echo "Merge applied cleanly. Merge this PR once CI is green."
            fi
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body_file"
            [ "$CONFLICTS" = "true" ] && gh pr ready "$existing" --undo || true
            echo "Updated PR #$existing"
          else
            draft=""
            [ "$CONFLICTS" = "true" ] && draft="--draft"
            gh pr create --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" --title "$title" --body-file "$body_file" $draft
          fi
