name: Prepress Build & Deploy

# Builds the fat Stirling-PDF image from the prepress branch, pushes an
# immutable prepress-<sha> tag to Docker Hub, then points the Coolify service
# at that tag and redeploys.
#
# Required repository configuration:
#   secrets.DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  — push rights on pubgen/stirling-pdf
#     (stored on the `prepress-prod` environment, not the repository)
#   secrets.COOLIFY_API_TOKEN                     — API token on the Coolify instance
#     (also on the `prepress-prod` environment)
#   vars.COOLIFY_BASE_URL                         — e.g. https://int.cubixmedia.fr
#   vars.COOLIFY_SERVICE_UUID                     — service uuid (stirling-pdf)
#   vars.PREPRESS_DEPLOY_ENABLED = 'true'         — flag guarding the pipeline until
#                                                 the secrets above are configured

on:
  push:
    branches:
      - prepress
  workflow_dispatch:

concurrency:
  group: prepress-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: pubgen/stirling-pdf

jobs:
  build-push-deploy:
    if: ${{ vars.PREPRESS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Deploy credentials live in this environment only; no other job can read them.
    environment: prepress-prod
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: vars
        run: echo "image_tag=prepress-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push fat image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/embedded/Dockerfile.fat
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE }}:prepress
          cache-from: type=registry,ref=${{ env.IMAGE }}:prepress-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:prepress-buildcache,mode=max

      - name: Point Coolify service at the new tag
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
          api="$COOLIFY_BASE_URL/api/v1"
          auth="Authorization: Bearer $COOLIFY_API_TOKEN"

          curl -fsS -H "$auth" "$api/services/$SERVICE_UUID" -o service.json
          python3 - "$IMAGE_TAG" <<'PY'
          import base64, json, re, sys
          svc = json.load(open("service.json"))
          raw = svc.get("docker_compose_raw") or svc.get("docker_compose")
          if not raw:
              sys.exit("service has no docker_compose_raw to patch")
          tag = sys.argv[1]
          new, n = re.subn(r"(image:\s*\S*?stirling-pdf:)[^\s'\"]+", rf"\g<1>{tag}", raw, count=1)
          if n == 0:
              sys.exit("no stirling-pdf image line found in compose")
          # The REST API wants the compose body base64-encoded.
          b64 = base64.b64encode(new.encode()).decode()
          json.dump({"docker_compose_raw": b64}, open("patch.json", "w"))
          PY
          curl -fsS -X PATCH -H "$auth" -H "Content-Type: application/json" \
            --data @patch.json "$api/services/$SERVICE_UUID"

      - name: Redeploy
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SERVICE_UUID: ${{ vars.COOLIFY_SERVICE_UUID }}
        run: |
          curl -fsS -X GET -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_BASE_URL/api/v1/deploy?uuid=$SERVICE_UUID&force=true"
