finding.PATTERN_USED=Pattern fills in use — tiling and flattening vary across RIPs
finding.SHADING_USED=Smooth shadings in use — flattening behaviour varies across RIPs
finding.OBJECT_OUTSIDE_PAGE=Content painted entirely outside the crop area — dead weight or a misplaced object
